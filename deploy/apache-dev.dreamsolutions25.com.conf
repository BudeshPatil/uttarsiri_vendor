# =============================================================================
# STAGING vhost — dev.dreamsolutions25.com
#
# aaPanel path: /www/server/panel/vhost/apache/dev.dreamsolutions25.com.conf
#
# Routing:
#   /api/     -> Express API      127.0.0.1:5016   (PM2 "dh-api")
#   /public/  -> API uploads      127.0.0.1:5016   (PM2 "dh-api")
#   /health   -> API health check 127.0.0.1:5016
#   /admin/   -> static Vite bundle on disk
#   /         -> Next.js website  127.0.0.1:4216   (PM2 "dh-website")
#
# Required modules:
#   a2enmod proxy proxy_http rewrite headers alias dir auth_basic ssl
# =============================================================================


<VirtualHost *:80>

    ServerAdmin webmaster@example.com

    ServerName b1637fb6.dev.dreamsolutions25.com
    ServerAlias dev.dreamsolutions25.com

    IncludeOptional /www/server/panel/vhost/apache/extension/dev.dreamsolutions25.com/*.conf

    ErrorLog "/www/wwwlogs/dev.dreamsolutions25.com-error_log"
    CustomLog "/www/wwwlogs/dev.dreamsolutions25.com-access_log" combined

    # Everything is TLS-only; send port 80 straight to HTTPS.
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://dev.dreamsolutions25.com/$1 [R=301,L]

</VirtualHost>


<VirtualHost *:443>

    ServerAdmin webmaster@example.com

    # No DocumentRoot: nothing is served from disk at "/" any more — the Next.js
    # process owns that path. /admin is mapped explicitly with Alias below.
    ServerName SSL.dev.dreamsolutions25.com
    ServerAlias dev.dreamsolutions25.com

    IncludeOptional /www/server/panel/vhost/apache/extension/dev.dreamsolutions25.com/*.conf

    ErrorLog "/www/wwwlogs/dev.dreamsolutions25.com-error_log"
    CustomLog "/www/wwwlogs/dev.dreamsolutions25.com-access_log" combined


    # =========================================================
    # SSL
    # =========================================================

    SSLEngine On

    SSLCertificateFile /www/server/panel/vhost/cert/dev.dreamsolutions25.com/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/dev.dreamsolutions25.com/privkey.pem

    SSLCipherSuite EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5:!ADH:!EXPORT56:!RC4:!3DES:!eNULL
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder On


    # =========================================================
    # DENY SENSITIVE FILES
    # =========================================================

    <Files ~ (\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)$>
        Require all denied
    </Files>


    # =========================================================
    # ACCESS CONTROL
    #
    # The staging site stays behind HTTP basic auth. This used to live in the
    # website <Directory> block, but the website is proxied now and a proxied
    # request never touches the filesystem — so <Directory> would silently stop
    # applying. <Location> is evaluated before proxying and keeps it working.
    # =========================================================

    <Location />
        AuthType basic
        AuthName "Authorization"
        AuthUserFile /www/server/pass/dev.dreamsolutions25.com.pass
        Require user admin
    </Location>

    # Exempt the API, its uploads and the dashboard — same as before, when the
    # auth block only covered the website directory. "Require all granted" in a
    # more specific <Location> overrides the rule above and suppresses the prompt.
    <Location /api>
        Require all granted
    </Location>
    <Location /public>
        Require all granted
    </Location>
    <Location /health>
        Require all granted
    </Location>
    <Location /admin>
        Require all granted
    </Location>

    # Dotfiles must stay blocked on proxied paths too. <Files> above only
    # matches requests that resolve to a real file, so it stops covering "/"
    # once the website is proxied — this <LocationMatch> is URL-based and does.
    # Listed last so the denial wins over the exemptions above.
    <LocationMatch "(^|/)\.(env|git|svn|htaccess|user\.ini|project)">
        Require all denied
    </LocationMatch>


    # =========================================================
    # PROXY
    # =========================================================

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # ---- Node.js API -----------------------------------------------------
    # Both forms: "/api/..." and a bare "/api".
    ProxyPass        /api/ http://127.0.0.1:5016/api/ retry=0
    ProxyPassReverse /api/ http://127.0.0.1:5016/api/
    ProxyPass        /api  http://127.0.0.1:5016/api  retry=0
    ProxyPassReverse /api  http://127.0.0.1:5016/api

    # ---- Uploaded media --------------------------------------------------
    # MISSING BEFORE: every image stored by the admin is served from
    # /public/uploads/... by the API. Without this rule they all 404.
    ProxyPass        /public/ http://127.0.0.1:5016/public/ retry=0
    ProxyPassReverse /public/ http://127.0.0.1:5016/public/

    <LocationMatch "^/public/uploads/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # ---- Health check ----------------------------------------------------
    ProxyPass        /health http://127.0.0.1:5016/health retry=0
    ProxyPassReverse /health http://127.0.0.1:5016/health


    # =========================================================
    # ADMIN  ->  /www/wwwroot/dev.dreamsolutions25.com/admin
    #
    # Static Vite bundle, served from disk. Not a Node process.
    # =========================================================

    # Keep mod_proxy away from /admin so the catch-all below cannot claim it.
    ProxyPass /admin !

    # Two aliases on purpose: the trailing-slash form alone does not match a
    # bare "/admin", which would otherwise fall through to the website.
    Alias /admin/ "/www/wwwroot/dev.dreamsolutions25.com/admin/"
    Alias /admin  "/www/wwwroot/dev.dreamsolutions25.com/admin"

    <Directory "/www/wwwroot/dev.dreamsolutions25.com/admin">

        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html

        # SPA fallback: react-router owns /admin/*, so any path that is not a
        # real file must return index.html. Without this, reloading a deep link
        # such as /admin/services returns 404.
        RewriteEngine On
        RewriteBase /admin
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]

    </Directory>

    # Vite emits content-hashed filenames, so assets are safe to cache forever.
    <LocationMatch "^/admin/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # index.html must never be cached or users keep the old bundle after a deploy.
    <LocationMatch "^/admin/(index\.html)?$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </LocationMatch>


    # =========================================================
    # WEBSITE  ->  Next.js on 127.0.0.1:4216
    #
    # This CANNOT be served from disk. /blogs/[slug], /portfolio/[slug] and
    # /services/[slug] are rendered per request, so a running Node process is
    # required. Must stay last: it is the catch-all.
    # =========================================================

    ProxyPass        / http://127.0.0.1:4216/ retry=0
    ProxyPassReverse / http://127.0.0.1:4216/

    # Admin uploads pass through /api — raise if you accept larger media.
    LimitRequestBody 26214400

</VirtualHost>
